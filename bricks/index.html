<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>工地時鐘</title>
<meta name="description" content="數字是水泥磚。分鐘一變，拆除工人先用電鑽把舊磚打掉，砌造工人再把新磚一塊一塊砌回來。 The digits are cinder blocks. Every minute the demolition crew jackhammers the old ones out, then the masons lay the new ones back brick by brick.">
<meta name="theme-color" content="#bcbcbc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bricks">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-hi:#7c7c7c;
    --sky-lo:#d8d8d8;
    --fence:#585858;
    --ground:#4a4a4a;
    --ground-2:#3a3a3a;
    --concrete:#bcbcbc;
    --concrete-hi:#f8f8f8;
    --concrete-lo:#7c7c7c;
    --accent:#3cbcfc;
    --accent-2:#0000fc;
    --ink:#000000;
    --ink-2:#5a5a5a;
    /* HUD 這幾支由 syncPalette() 依時段覆寫，這裡放的是白天值 */
    --hud:#000000;
    --hud-key:#3cbcfc;
    --hud-dim:#5a5a5a;
    --hud-sh:rgba(255,255,255,.55);
    --bar-bg:rgba(255,255,255,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#9a9a9a}
  body{
    font-family:'Silkscreen',ui-monospace,'Courier New',monospace;
    color:var(--ink);-webkit-font-smoothing:none;-webkit-tap-highlight-color:transparent;
  }
  #stage{position:fixed;inset:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  .hud{
    position:absolute;left:0;right:0;pointer-events:none;
    font-size:clamp(12px,1.7vw,14px);letter-spacing:.04em;line-height:1.5;
    padding:max(clamp(10px,2.5vw,22px),env(safe-area-inset-top)) clamp(12px,3vw,24px)
            max(clamp(10px,2.5vw,22px),env(safe-area-inset-bottom));
    color:var(--hud);text-shadow:0 2px 0 var(--hud-sh);
  }
  #hudTop{top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .k{color:var(--hud-key);font-size:clamp(8px,1.1vw,11px);letter-spacing:.14em;display:block;margin-bottom:6px;line-height:1.3}
  #hudBot{bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}

  #wave{flex:1;max-width:380px;min-width:0}
  #waveLabel{color:var(--hud-key);font-size:clamp(10px,1.3vw,12px);margin-bottom:8px;letter-spacing:.1em;white-space:nowrap}
  #bar{height:10px;border:2px solid var(--hud);background:var(--bar-bg);position:relative}
  #fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--hud-key);transition:width .25s linear}

  #ctrl{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto;transition:opacity .5s}
  button{
    font:inherit;font-size:clamp(8px,1.3vw,11px);color:var(--ink);
    background:rgba(255,255,255,.7);border:2px solid var(--ink);
    padding:8px 10px;cursor:pointer;border-radius:0;touch-action:manipulation;
    box-shadow:2px 2px 0 var(--ink);
  }
  button:active{transform:translate(2px,2px);box-shadow:none}
  button:hover{background:#fff}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button[aria-pressed="true"]{background:var(--accent);color:#000}
  button[hidden]{display:none}
  #keys{position:absolute;left:clamp(12px,3vw,24px);
        bottom:calc(max(clamp(10px,2.5vw,22px),env(safe-area-inset-bottom)) + 3.6em);
        color:var(--hud-dim);font-size:clamp(8px,1.3vw,11px);pointer-events:none;transition:opacity .5s}
  body.rest #ctrl,body.rest #keys{opacity:0}
  body.rest #ctrl{pointer-events:none}
  body.embed #ctrl,body.embed #keys{display:none}
  @media (max-width:640px){ #keys{display:none} #hudBot{flex-direction:column;align-items:stretch} #ctrl{justify-content:center} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>

  <div class="hud" id="hudTop">
    <div><span class="k">SCRAP</span><span id="coins">×00</span></div>
    <div style="text-align:right"><span class="k">TODAY</span><span id="date">—</span></div>
  </div>

  <div class="hud" id="hudBot">
    <div id="wave">
      <div id="waveLabel">NEXT SHIFT</div>
      <div id="bar"><div id="fill"></div></div>
    </div>
    <div id="ctrl">
      <button id="bInstall" hidden>INSTALL</button>
      <button id="bTest">BUILD</button>
      <button id="bFmt" aria-pressed="true">24H</button>
      <button id="bSnd" aria-pressed="false">SOUND</button>
      <button id="bWake" aria-pressed="false">AWAKE</button>
      <button id="bFull">FULL</button>
      <button id="bLang">EN</button>
    </div>
  </div>
  <div id="keys">SPACE BUILD · T FORMAT · S SOUND · W AWAKE · F FULL</div>
</div>

<script>
(() => {
'use strict';

// ── 語言 ────────────────────────────────────────────────────────
const EN = { _title:'Construction Clock' };
const LANG_EN = (localStorage.getItem('clocklab.lang')
              || (navigator.language.startsWith('zh') ? 'zh' : 'en')) === 'en';
if(LANG_EN){
  document.documentElement.lang = 'en';
  document.title = EN._title;
  for(const [k, s] of Object.entries(EN)) document.getElementById(k)?.replaceChildren(s);
}
{
  const b = document.getElementById('bLang');
  b.textContent = LANG_EN ? '中' : 'EN';
  b.onclick = () => { localStorage.setItem('clocklab.lang', LANG_EN ? 'zh' : 'en'); location.reload(); };
}

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

// 每座時鐘各自持有一份，故意不共用 —— 資料夾之間零相依
const FONT = {
  '0':["01110","10001","10011","10101","11001","10001","01110"],
  '1':["00100","01100","00100","00100","00100","00100","01110"],
  '2':["01110","10001","00001","00010","00100","01000","11111"],
  '3':["11111","00010","00100","00010","00001","10001","01110"],
  '4':["00010","00110","01010","10010","11111","00010","00010"],
  '5':["11111","10000","11110","00001","00001","10001","01110"],
  '6':["00110","01000","10000","11110","10001","10001","01110"],
  '7':["11111","00001","00010","00100","01000","01000","01000"],
  '8':["01110","10001","10001","01110","10001","10001","01110"],
  '9':["01110","10001","10001","01111","00001","00010","01100"]
};

// ── NES 色盤子集 ────────────────────────────────────────────────
// 每個 sprite 最多 3 個實色 + 透明，共 ≤4 色，符合 NES 單一 tile 的硬體限制。
// 這是一座時鐘，所以整組配色跟著它自己顯示的小時走：下午兩點打開不該看到深夜工地。
// 依小時硬切四段，不做漸變補間 —— 一天切四次，每次瞬間換色，這才像 NES。
const OUT = '#000000';

// 色票只用 NES 2C02 標準色盤裡真的存在的色（外加原本這座時鐘就在用的幾階灰）。
// 角色：sky* 天空三段硬邊色帶／edge 遠景剪影／gnd* 地面鋪面／soil* 地面以下土層／
//       brk* 水泥磚亮基暗／wear 工作服／vest+hat 砌造組／accent 工程藍／lamp 夜間投光燈
const PALETTES = {
  // 白天 07-15：原本這版，一個字都不動
  day: {
    skyHi:'#7c7c7c', skyMid:'#d8d8d8', skyLo:'#9a9a9a', edge:'#585858',
    gndT:'#f8f8f8', gndD:'#7c7c7c', gndP:'#585858', soil:'#4a4a4a', soil2:'#3a3a3a',
    brkH:'#f8f8f8', brkA:'#bcbcbc', brkD:'#7c7c7c',
    plank:'#bcbcbc', post:'#585858', shard:'#7c7c7c', dust:'#f8f8f8', haze:'#d8d8d8',
    spark:'#f87858', accent:'#3cbcfc', wear:'#bcbcbc', vest:'#3cbcfc', hat:'#f8f8f8',
    lamp:null,
    hud:'#000000', hudKey:'#3cbcfc', hudDim:'#5a5a5a',
    hudSh:'rgba(255,255,255,.55)', barBg:'rgba(255,255,255,.45)'
  },
  // 清晨 05-06：魚肚白，冷調微亮，天頂還留著夜色
  dawn: {
    skyHi:'#4428bc', skyMid:'#a4e4fc', skyLo:'#b8b8f8', edge:'#4428bc',
    gndT:'#b8b8f8', gndD:'#787878', gndP:'#4428bc', soil:'#004058', soil2:'#000000',
    brkH:'#fcfcfc', brkA:'#b8b8f8', brkD:'#787878',
    plank:'#bcbcbc', post:'#4428bc', shard:'#787878', dust:'#fcfcfc', haze:'#b8b8f8',
    spark:'#f83800', accent:'#0058f8', wear:'#bcbcbc', vest:'#0058f8', hat:'#fcfcfc',
    lamp:null,
    hud:'#fcfcfc', hudKey:'#a4e4fc', hudDim:'#b8b8f8',
    hudSh:'#000000', barBg:'#000000'
  },
  // 黃昏 16-17：低角度橘紅光，只有朝上的面被打亮，其餘壓成暖褐
  dusk: {
    skyHi:'#881400', skyMid:'#fca044', skyLo:'#e45c10', edge:'#503000',
    gndT:'#f0d0b0', gndD:'#503000', gndP:'#000000', soil:'#503000', soil2:'#000000',
    brkH:'#fce0a8', brkA:'#bcbcbc', brkD:'#503000',
    plank:'#f0d0b0', post:'#503000', shard:'#503000', dust:'#fce0a8', haze:'#f0d0b0',
    spark:'#f83800', accent:'#0058f8', wear:'#bcbcbc', vest:'#0058f8', hat:'#fce0a8',
    lamp:null,
    hud:'#fce0a8', hudKey:'#3cbcfc', hudDim:'#f0d0b0',
    hudSh:'#000000', barBg:'#000000'
  },
  // 夜間 18-04：深藍夜，對比最強。磚偏冷偏暗，工程藍與火花在暗底上自己會跳出來
  night: {
    skyHi:'#000000', skyMid:'#0000bc', skyLo:'#4428bc', edge:'#000000',
    gndT:'#787878', gndD:'#004058', gndP:'#000000', soil:'#000000', soil2:'#004058',
    brkH:'#bcbcbc', brkA:'#787878', brkD:'#004058',
    plank:'#bcbcbc', post:'#004058', shard:'#787878', dust:'#787878', haze:'#6888fc',
    spark:'#fca044', accent:'#3cbcfc', wear:'#bcbcbc', vest:'#3cbcfc', hat:'#f8f8f8',
    lamp:['#fce0a8','#f8b800'],
    hud:'#fcfcfc', hudKey:'#3cbcfc', hudDim:'#6888fc',
    hudSh:'#000000', barBg:'#000000'
  }
};

const periodOf = h => (h>=5 && h<=6) ? 'dawn' : (h>=7 && h<=15) ? 'day'
                    : (h>=16 && h<=17) ? 'dusk' : 'night';

let PAL = PALETTES.day, palKey = '';

// 每幀重算，純粹看「當下這個小時」，不快取成啟動時決定 ——
// 掛一整天的時鐘要能在 18:00 自己變成夜間
function syncPalette(){
  const k = periodOf(new Date().getHours());
  if(k === palKey) return;
  palKey = k; PAL = PALETTES[k];
  COL_BRICK.H = PAL.brkH; COL_BRICK.A = PAL.brkA; COL_BRICK.D = PAL.brkD;
  COL_GROUND.T = PAL.gndT; COL_GROUND.D = PAL.gndD; COL_GROUND.P = PAL.gndP;
  COL_BOLT.A = PAL.wear;  COL_BOLT.H = PAL.accent;
  COL_TOOL.C = PAL.accent;
  COL_DEMO.H = PAL.accent; COL_DEMO.B = PAL.wear;
  COL_BUILD.H = PAL.hat;   COL_BUILD.B = PAL.vest;
  COL_IDLE.H = PAL.accent; COL_IDLE.B = PAL.wear;
  COL_CART.A = PAL.wear;
  const st = document.documentElement.style;
  st.setProperty('--accent', PAL.accent);
  st.setProperty('--hud', PAL.hud);
  st.setProperty('--hud-key', PAL.hudKey);
  st.setProperty('--hud-dim', PAL.hudDim);
  st.setProperty('--hud-sh', PAL.hudSh);
  st.setProperty('--bar-bg', PAL.barBg);
}

// 水泥磚：拆除與砌造共用同一副骨架，只是被拆時已經站在原地。
// 純灰階三階（亮面／基底／暗面）＋黑色磚縫，不放任何 accent —— 藍色只留給人造物／機具
const BRICK_MAP = [
  "XXXXXXXX",
  "XHHHHHHX",
  "XHAAAADX",
  "XHAAAADX",
  "XXXXXXXX",
  "XHAAAADX",
  "XDDDDDDX",
  "XXXXXXXX"
];
// ORDER 是這張圖的上色順序（暗到亮），跟色票分開存 —— 長條之間有 1px 的重疊，
// 誰後畫誰壓在上面，順序寫死才不會換個時段連磚縫粗細都跟著變
const COL_BRICK = {X:OUT, H:'#f8f8f8', A:'#bcbcbc', D:'#7c7c7c', ORDER:'XDAH'};

// 拆除工地上偶爾挖到的舊零件（取代金幣）
const BOLT_MAP = [
  "..XXXX..",
  ".XAAAAX.",
  "XAAHHAAX",
  "XAHXXHAX",
  "XAHXXHAX",
  "XAAHHAAX",
  ".XAAAAX.",
  "..XXXX.."
];
const COL_BOLT = {X:OUT, A:'#bcbcbc', H:'#3cbcfc', ORDER:'XHA'};

// 地面：碎石／柏油鋪面
const GROUND_MAP = [
  "XXXXXXXX",
  "XTTTTTTX",
  "XDDDDDDX",
  "XDDPDDDX",
  "XDDDDDDX",
  "XDPDDDPX",
  "XDDDDDDX",
  "XXXXXXXX"
];
const COL_GROUND = {X:OUT, T:'#f8f8f8', D:'#7c7c7c', P:'#585858', ORDER:'XPDT'};

// 電鑽：由下往上打，最上面那格就是鑽頭尖端，正好頂住正在崩解的那一排磚
const TOOL_DRILL = [
  "..XX..",
  "..XX..",
  ".XXXX.",
  ".XCCX.",
  "XXCCXX",
  "XCCCCX",
  "XXXXXX"
];
const COL_TOOL = {X:OUT, C:'#3cbcfc', ORDER:'XC'};

// 砌造組的推車，站在旁邊，跟拆除組單靠一個人蹲低頂鑽的剪影完全不同
const CART_MAP = [
  "XXXXXXXXX",
  "XAAAAAAAX",
  "XXXXXXXXX",
  "..X...X..",
  ".XXX.XXX."
];
const COL_CART = {X:OUT, A:'#bcbcbc', ORDER:'XA'};

// 兩組工人在剪影層級就要分得出來，不能只靠帽子顏色。
// 每張圖的第 0 排就是「手」，工具／磚塊接在手上方 —— 畫的時候用手當錨點，
// 工人自然就掛在他正在處理的那塊磚底下。
//
// 拆除組：12 寬 x 11 高的矮胖蹲姿。安全帽在最頂、帽簷下留一張窄臉（這格是
// 「看起來像人而不是機具」的關鍵），雙腿大開下蹲，右手往上舉著電鑽。
const DEMO_BODY = [
  ".........XXX",
  "..XXXXX..XBX",
  ".XXHHHXX.XBX",
  ".XHHHHHX.XBX",
  "XXXXXXXXXXBX",
  "..XBBBX.XXBX",
  ".XXXXXXX.XBX",
  ".XBBBBBXXBX.",
  "XBXBBBXXX...",
  ".XXBBBXX....",
  "XBBX.XBBX...",
  "XXX...XXX..."
];
const COL_DEMO = {X:OUT, H:'#3cbcfc', B:'#bcbcbc', ORDER:'XHB'};

// 砌造組：12 寬 x 13 高的瘦高站姿，單手把磚舉上去放好，旁邊擺一台推車
const BUILD_BODY = [
  ".........XXX",
  "..XXXXX..XBX",
  ".XXHHHXX.XBX",
  ".XHHHHHX.XBX",
  "XXXXXXXXXXBX",
  "..XBBBX.XXBX",
  "..XXXXX.XBBX",
  ".XBBBBBXXBX.",
  "XBXBBBXXX...",
  "XBXBBBXX....",
  ".XXBBBXX....",
  "..XBXBX.....",
  ".XXX.XXX...."
];
const COL_BUILD = {X:OUT, H:'#f8f8f8', B:'#3cbcfc', ORDER:'XBH'};

// 沒在施工的時候站在工地邊上的工頭 —— 這座時鐘任何一幀都看得到人
const IDLE_BODY = [
  "..XXXXX..",
  ".XXHHHXX.",
  ".XHHHHHX.",
  "XXXXXXXXX",
  "..XBBBX..",
  "..XXXXX..",
  ".XBBBBBX.",
  "XBXBBBXBX",
  "XBXBBBXBX",
  ".XXBBBXX.",
  "..XBXBX..",
  ".XXX.XXX."
];
const COL_IDLE = {X:OUT, H:'#3cbcfc', B:'#bcbcbc', ORDER:'XHB'};

// ── 背景開關 ────────────────────────────────────────────────────
const SHOW = {
  cranes: true,   // 遠景吊車剪影
  fence:  true    // 地平線上的圍籬
};

// ── 版面 ────────────────────────────────────────────────────────
const STACK_RATIO = 1.25;
let W=0,H=0,dpr=1,cell=10,originX=0,originY=0,stack=false,booted=false;
let GRID_COLS=24, GRID_ROWS=7, POS=[], ROWS=[];

function layout(){
  W = cv.clientWidth; H = cv.clientHeight;
  dpr = Math.min(window.devicePixelRatio||1, 2);
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled = false;

  stack = (W/H) < STACK_RATIO;
  if(stack){
    GRID_COLS = 11; GRID_ROWS = 15;
    POS = [{c:0,r:0},{c:6,r:0},{c:0,r:8},{c:6,r:8}];
    ROWS = [0,8];
    cell = Math.min(W/(GRID_COLS+3), H/(GRID_ROWS+10));
  }else{
    GRID_COLS = 24; GRID_ROWS = 7;
    POS = [{c:0,r:0},{c:6,r:0},{c:13,r:0},{c:19,r:0}];
    ROWS = [0];
    cell = Math.min(W/(GRID_COLS+5), H/(GRID_ROWS+14));
  }
  originX = (W - GRID_COLS*cell)/2;
  originY = (H - GRID_ROWS*cell)/2 - cell*1.4;

  bricks.forEach(b => {
    const t = targetOf(b.d,b.r,b.c);
    b.tx=t.x; b.ty=t.y;
    if(b.state==='idle'){ b.x=b.tx; b.y=b.ty; }
  });
  booted = true;
}

// 每一排數字腳下都有一條地面，工人就站在上面。
// 最下面那排是真正的工地地面，留 3.2 格給工人和鷹架；直式版面上排腳下只有
// 一格空隙，棧板就貼著那格畫，不然橫桿會直接切過下排數字。
const GAP = 3.2;
const floorRow = () => ROWS[ROWS.length-1];
const ledgeY = row => originY + (row+7)*cell + cell*(row === floorRow() ? GAP : 0.35);

// ── 實體 ────────────────────────────────────────────────────────
let bricks=[], shards=[], bolts=[], pops=[], dust=[], sparks=[], runs=[];

let shake=0;
let time=0, h24=true, sound=false, boltCount=0;
// want = 想顯示的；drawn = 畫面上真的已經放好的。兩者分開是這支程式的關鍵：
// 只有真的放好才寫進 drawn，所以任何一步卡住，下一幀都會自己重試。
let want=['','','',''], drawn=['','','',''];

function commit(d, ch){
  drawn[d] = ch;
  document.documentElement.dataset.shown = drawn.join('');
}

const easeOut = t => 1-Math.pow(1-t,3);

function targetOf(d,r,c){
  const p = POS[d];
  return { x: originX + (p.c+c+0.5)*cell, y: originY + (p.r+r+0.5)*cell };
}

// 唯一的 commit() 呼叫點：FONT[ch] 查不到就整個放棄，drawn 維持原狀
function buildDigit(d, ch){
  if(!FONT[ch]) return false;
  commit(d, ch);
  return true;
}

function cellsOf(ch){
  const g = FONT[ch]; if(!g) return [];
  const out = [];
  for(let r=6;r>=0;r--) for(let c=0;c<5;c++) if(g[r][c]==='1') out.push({r,c});
  return out;
}

function rowsOf(d){
  const set = new Set();
  for(const b of bricks) if(b.alive && b.d===d) set.add(b.r);
  return [...set].sort((a,b)=>b-a);   // 由下而上
}

function placeAllCells(d, ch){
  for(const {r,c} of cellsOf(ch)){
    const t = targetOf(d,r,c);
    bricks.push({d, r, c, tx:t.x, ty:t.y, x:t.x, y:t.y, state:'idle', alive:true, pop:1});
  }
}

function placeCell(d, r, c){
  const t = targetOf(d, r, c);
  bricks.push({d, r, c, tx:t.x, ty:t.y, x:t.x, y:t.y, state:'idle', alive:true, pop:1});
  puffMortar(t.x, t.y);
  blip('place');
}

function timeStr(){
  const d=new Date(); let h=d.getHours();
  if(!h24){ h=h%12; if(h===0) h=12; }
  return String(h).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
}

function startChange(next, forceAll){
  let k = 0;
  for(let d=0; d<4; d++){
    if(!forceAll && want[d] === next[d]) continue;
    if(runs.some(r => r.d === d)) continue;   // 還在施工，下一幀再試
    want[d] = next[d];
    const oldRows = rowsOf(d);
    runs.push({
      d, ch: next[d],
      phase: 'wait', t:0, age:0, delay:k*0.12,
      hasOld: oldRows.length>0,
      rows: oldRows, ri:0,
      salvageRow: oldRows.length ? oldRows[Math.floor(Math.random()*oldRows.length)] : -1,
      cells: cellsOf(next[d]), ci:0,
      built:false
    });
    k++;
  }
}

// ── 節奏常數：單一數字從第一步到 run 回收，總長務必 < 3.5 秒虛擬時間 ──
const T_ENTER  = 0.38;   // 進場
const T_ROW    = 0.12;   // 拆除：每排
const T_SWAP   = 0.18;   // 拆除組退場／砌造組進場的交接空檔
const T_CELL   = 0.045;  // 砌造：每塊
const T_SETTLE = 0.08;   // 最後一塊落定後的短暫停頓
const T_LEAVE  = 0.36;   // 退場

// 工人：手到腳的身高，以及手到工具尖端的距離。
// 兩者加起來 ≈ cell*3.5，剛好等於數字下緣到地面的 GAP，所以打最底下那排時
// 工人是實實在在站在地上的；往上打就靠鷹架把自己頂上去。
const RIG_H = () => cell*2.6;
const REACH = () => cell*0.6;
const DRILL_L = () => cell*1.2;        // 電鑽全長，工人握在中段
const DEMO_HAND = 10, BUILD_HAND = 10;  // 「手」在各自點陣圖上的欄

// 這一幀該對付哪一塊磚：拆除看 R.ri（由下往上一排排打），砌造看 R.ci（由下往上一塊塊砌）。
// 兩邊都是由下往上，所以工人永遠待在已經清空的那一側，不會擋住還沒動到的磚。
// 回傳的是「工具尖端該頂住的點」，工人的位置再從這點往下推。
function workAim(R){
  const p = POS[R.d];
  const demoing = R.phase==='wait' ? R.hasOld
                : (R.phase==='enterDemo' || R.phase==='drill' || R.phase==='swap');
  if(!demoing && R.cells.length){
    const k = R.cells[Math.min(R.ci, R.cells.length-1)];
    return { x: targetOf(R.d, k.r, k.c).x, y: originY + (p.r+k.r+1)*cell };
  }
  const row = R.rows.length ? R.rows[Math.min(R.ri, R.rows.length-1)] : 6;
  let sum=0, n=0;
  for(const b of bricks) if(b.alive && b.d===R.d && b.r===row){ sum+=b.x; n++; }
  return { x: n ? sum/n : originX + (p.c+2.5)*cell, y: originY + (p.r+row+1)*cell };
}

// 進退場時才需要水平內插，其餘時候直接用平滑追上去的 R.wx，
// 全部從目前的 W / originX 現算，resize 或直橫式切換時不需要額外同步。
function runX(R){
  const target = R.wx;
  const offLeft = -cell*5, offRight = W + cell*5;
  switch(R.phase){
    case 'enterDemo':  return offLeft  + (target-offLeft)  * easeOut(Math.min(1, R.t/T_ENTER));
    case 'enterBuild': return offRight + (target-offRight) * easeOut(Math.min(1, R.t/T_ENTER));
    case 'leave':       return target + (offRight-target) * easeOut(Math.min(1, R.t/T_LEAVE));
    default: return target;
  }
}

function updateRuns(dt){
  for(let i=runs.length-1;i>=0;i--){
    const R=runs[i]; R.t+=dt; R.age+=dt;

    // 看門狗：任何情況下都不讓一個 run 永久佔住某個數字
    if(R.age > 15){
      bricks.forEach(b => { if(b.d===R.d) b.alive=false; });
      if(!R.built && buildDigit(R.d, R.ch)) placeAllCells(R.d, R.ch);
      runs.splice(i,1); continue;
    }

    // 工人這一幀該站的位置：由「正在處理的那塊磚」反推，再平滑追上去，
    // 一排排往上打／一塊塊往上砌時看起來就是沿著鷹架爬升，而不是瞬移
    const aim = workAim(R);
    if(R.wx === undefined){ R.wx = aim.x; R.wy = aim.y; }
    else{
      const k = Math.min(1, dt*16);
      R.wx += (aim.x-R.wx)*k; R.wy += (aim.y-R.wy)*k;
    }

    switch(R.phase){
      case 'wait':
        if(R.t >= R.delay){ R.phase = R.hasOld ? 'enterDemo' : 'enterBuild'; R.t=0; }
        break;

      case 'enterDemo':
        if(R.t >= T_ENTER){ R.phase='drill'; R.t=0; R.ri=0; }
        break;

      case 'drill':
        if(!RM){
          shake = Math.max(shake, 0.45);   // 電鑽頂著磚塊的持續反作用力，不能只有撞擊瞬間才震
          // 火花就從鑽頭尖端噴出來 —— 跟工人手上的那支電鑽是同一個座標
          if(Math.random() < dt*30) spawnSpark(R.wx, R.wy);
        }
        if(Math.random() < dt*3) blip('drill');
        if(R.t >= T_ROW){
          R.t -= T_ROW;
          if(R.ri < R.rows.length){ breakRow(R, R.rows[R.ri]); R.ri++; }
          if(R.ri >= R.rows.length){
            R.phase='swap'; R.t=0;
            for(let n=0;n<5;n++) puffMortar(R.wx, R.wy + REACH() + RIG_H());
          }
        }
        break;

      case 'swap':
        if(R.t >= T_SWAP){ R.phase='enterBuild'; R.t=0; }
        break;

      case 'enterBuild':
        if(R.t >= T_ENTER){ R.phase='build'; R.t=0; R.ci=0; }
        break;

      case 'build':
        if(R.t >= T_CELL){
          R.t -= T_CELL;
          if(R.ci < R.cells.length){
            const cellPos = R.cells[R.ci];
            placeCell(R.d, cellPos.r, cellPos.c);
            R.ci++;
          }
          if(R.ci >= R.cells.length){
            if(buildDigit(R.d, R.ch)) R.built = true;
            R.phase='settle'; R.t=0;
          }
        }
        break;

      case 'settle':
        if(R.t >= T_SETTLE){ R.phase='leave'; R.t=0; }
        break;

      case 'leave':
        if(R.t >= T_LEAVE){ runs.splice(i,1); }
        break;
    }
  }
}

// 由下往上，整排一起崩解
function breakRow(R, r){
  const rowBricks = bricks.filter(b => b.alive && b.d===R.d && b.r===r);
  const isSalvage = r === R.salvageRow;
  for(const b of rowBricks){
    b.alive = false;
    spawnDebris(b.x, b.y);
  }
  if(isSalvage && rowBricks.length){
    const cx = rowBricks.reduce((s,b) => s+b.x, 0) / rowBricks.length;
    const cy = rowBricks[0].y;
    for(let i=0;i<3;i++) spawnBolt(cx+(i-1)*cell*0.4, cy);
    pops.push({x:cx, y:cy-cell*0.6, life:0.8, n:3});
    blip('salvage');
  }
  shake = Math.min(1, shake+0.85);
  blip('crumble');
}

// ── 粒子 ────────────────────────────────────────────────────────
function spawnDebris(x, y){
  for(let i=0;i<3;i++){
    const s = cell*0.32;
    shards.push({
      x: x+(Math.random()-0.5)*cell*0.6, y: y+(Math.random()-0.5)*cell*0.4,
      vx:(Math.random()-0.5)*cell*10, vy:-(0.6+Math.random()*0.8)*cell*10,
      rot:Math.random()*6.28, vr:(Math.random()-0.5)*12, s, life:0.5+Math.random()*0.3
    });
  }
}
function spawnBolt(x, y){
  bolts.push({x, y, vx:(Math.random()-0.5)*cell*3, vy:-cell*(14+Math.random()*4), life:0.8});
  boltCount++;
}
function spawnSpark(x, y){
  for(let i=0;i<4;i++)
    sparks.push({x:x+(Math.random()-0.5)*cell*0.6, y:y+(Math.random()-0.5)*cell*0.4,
      vx:(Math.random()-0.5)*cell*12, vy:-Math.random()*cell*8, life:0.16+Math.random()*0.12});
}
function puffMortar(x, y){
  const n = RM ? 1 : 4;
  for(let i=0;i<n;i++)
    dust.push({x:x+(Math.random()-0.5)*cell*0.5, y:y-cell*0.1,
      vx:(Math.random()-0.5)*cell*3, vy:-Math.random()*cell*2.4,
      life:0.28+Math.random()*0.14, s:cell*(0.1+Math.random()*0.12)});
}

// ── 更新 ────────────────────────────────────────────────────────
function update(dt){
  syncPalette();                   // 純看當下小時，不快取 —— 掛整天也會自己換時段
  startChange(timeStr(), false);   // 每幀比對，卡住的數字會自己追上
  updateRuns(dt);

  for(const b of bricks) if(b.pop>0) b.pop = Math.max(0, b.pop - dt*6);
  bricks = bricks.filter(b => b.alive);

  for(let i=shards.length-1;i>=0;i--){
    const s=shards[i];
    s.vy += cell*30*dt; s.x += s.vx*dt; s.y += s.vy*dt;
    s.rot += s.vr*dt; s.life -= dt;
    if(s.life<=0 || s.y > H+cell*3) shards.splice(i,1);
  }
  for(let i=bolts.length-1;i>=0;i--){
    const c=bolts[i];
    c.vy += cell*22*dt; c.y += c.vy*dt; c.x += c.vx*dt; c.life -= dt;
    if(c.life<=0) bolts.splice(i,1);
  }
  for(let i=pops.length-1;i>=0;i--){
    const q=pops[i]; q.y -= cell*2.2*dt; q.life -= dt;
    if(q.life<=0) pops.splice(i,1);
  }
  for(let i=dust.length-1;i>=0;i--){
    const q=dust[i];
    q.x += q.vx*dt; q.y += q.vy*dt; q.vy += cell*8*dt; q.vx *= 0.9; q.life -= dt;
    if(q.life<=0) dust.splice(i,1);
  }
  for(let i=sparks.length-1;i>=0;i--){
    const q=sparks[i];
    q.x += q.vx*dt; q.y += q.vy*dt; q.vy += cell*14*dt; q.life -= dt;
    if(q.life<=0) sparks.splice(i,1);
  }
  shake = Math.max(0, shake - dt*4.5);
}

// ── 繪製 ────────────────────────────────────────────────────────
// 每張點陣圖只在第一次用到時拆成「同色的水平長條」，之後每幀照著填就好。
// 一塊 8x8 的磚本來要 64 次 fillRect＋64 次字串索引，拆完只剩 24 條、同色還連在一起，
// 畫出來的像素完全一樣，但整支 draw() 的呼叫次數掉到三分之一。
// 長條裡存的是點陣圖上的字母而不是色碼，色碼要畫的時候才查 ——
// 這樣時段換色只要改 COL_* 物件就好，不必把快取整個丟掉重算。
const _ops = new Map();
function opsOf(map, order){
  let o = _ops.get(map);
  if(o) return o;
  o = [];
  const w = map[0].length;
  for(let r=0;r<map.length;r++){
    const row = map[r];
    let c = 0;
    while(c < w){
      const ch = row[c];
      if(ch === '.'){ c++; continue; }
      let e = c+1;
      while(e < w && row[e] === ch) e++;
      o.push({k:ch, x:c, y:r, w:e-c});
      c = e;
    }
  }
  o.sort((a,b) => order.indexOf(a.k) - order.indexOf(b.k));   // 同色排在一起，少切 fillStyle
  _ops.set(map, o);
  return o;
}

function sprite(map, cx, cy, px, colors, alpha, rot, sx, sy){
  const ops = opsOf(map, colors.ORDER);
  const kx = px*(sx ?? 1), ky = px*(sy ?? 1);
  const ox = -kx*map[0].length/2, oy = -ky*map.length/2;
  const ph = Math.max(1, Math.ceil(ky));
  ctx.save();
  ctx.globalAlpha = alpha ?? 1;
  ctx.translate(Math.round(cx), Math.round(cy));
  if(rot) ctx.rotate(rot);
  let cur = '';
  for(let i=0;i<ops.length;i++){
    const o = ops[i];
    if(o.k !== cur) ctx.fillStyle = colors[cur = o.k];
    const x0 = Math.round(ox + o.x*kx);
    ctx.fillRect(x0, Math.round(oy + o.y*ky), Math.max(1, Math.round(ox + (o.x+o.w)*kx) - x0), ph);
  }
  ctx.restore();
}

function drawBackground(){
  // NES 畫不出漸層：天空改成三段硬邊色帶，數字所在的中段刻意最亮
  const b1 = Math.round(H*0.28), b2 = Math.round(H*0.64);
  ctx.fillStyle = PAL.skyHi;  ctx.fillRect(0, 0, W, b1);
  ctx.fillStyle = PAL.skyMid; ctx.fillRect(0, b1, W, b2-b1);
  ctx.fillStyle = PAL.skyLo;  ctx.fillRect(0, b2, W, H-b2);

  const horizon = ledgeY(floorRow());

  if(SHOW.cranes){
    ctx.strokeStyle = PAL.edge; ctx.fillStyle = PAL.edge;
    ctx.lineWidth = Math.max(2, cell*0.1);
    const step = cell*16;
    for(let i=-1; i*step < W+step; i++){
      const cx = i*step + step*0.32;
      const mastH = cell*7;
      ctx.fillStyle = PAL.edge;   // 每輪迴圈重設，避免被下面警示燈的藍色污染到下一座塔
      ctx.fillRect(Math.round(cx-cell*0.12), Math.round(horizon-mastH), Math.round(cell*0.24), Math.round(mastH));
      ctx.beginPath();
      ctx.moveTo(cx-cell*3.0, horizon-mastH+cell*0.3);
      ctx.lineTo(cx+cell*1.6, horizon-mastH+cell*0.3);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx-cell*2.2, horizon-mastH+cell*0.3);
      ctx.lineTo(cx-cell*2.2, horizon-mastH+cell*1.5);
      ctx.stroke();
      // 警示燈：塔頂閃爍的工程藍方塊，藍色只用在機具／人造物上
      // 夜間常亮（而且大一號），暗底上這顆藍點就是工地還在運轉的訊號
      if(PAL.lamp || (!RM && Math.floor(time*2)%2===0)){
        ctx.fillStyle = PAL.accent;
        const ls = Math.max(2, Math.round(cell*(PAL.lamp ? 0.26 : 0.16)));
        ctx.fillRect(Math.round(cx-ls/2), Math.round(horizon-mastH-ls), ls, ls);
      }
    }
  }

  if(SHOW.fence){
    ctx.strokeStyle = PAL.edge; ctx.lineWidth = Math.max(1, cell*0.05);
    const fy = horizon - cell*1.5, fh = cell*1.1, step = cell*0.9;
    ctx.beginPath();
    for(let x=-cell; x<W+cell; x+=step){
      ctx.moveTo(x, fy); ctx.lineTo(x+step, fy+fh);
      ctx.moveTo(x, fy+fh); ctx.lineTo(x+step, fy);
    }
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, fy); ctx.lineTo(W, fy);
    ctx.moveTo(0, fy+fh); ctx.lineTo(W, fy+fh);
    ctx.stroke();
  }
}

// 夜間工地照明。光暈不用半透明也不用漸層 —— 就是燈頭下方一塊固定形狀的亮色區塊，
// 三階硬邊往下擴出去，再在地面補一道被照亮的鋪面。這是 NES 表現光的方式。
function drawLamps(gy){
  const step = Math.max(cell*9, W/4), poleH = cell*1.9;
  const wid = [cell*0.42, cell*0.8, cell*1.25, cell*1.8], seg = poleH/wid.length;
  const lw = Math.max(1, Math.round(cell*0.05));
  for(let i=0; i*step < W+step; i++){
    const x = Math.round(i*step + step*0.55);
    const top = Math.round(gy - poleH);
    for(let s=0;s<wid.length;s++){
      const w = Math.round(wid[s]);
      ctx.fillStyle = PAL.lamp[s ? 1 : 0];
      ctx.fillRect(x-(w>>1), Math.round(top + s*seg), w, Math.ceil(seg));
    }
    ctx.fillStyle = PAL.edge;                          // 燈桿在光裡是一道暗線
    ctx.fillRect(x-(lw>>1), top, lw, Math.round(gy)-top);
    ctx.fillStyle = OUT;                               // 燈頭
    ctx.fillRect(x-Math.round(cell*0.3), top-Math.round(cell*0.34), Math.round(cell*0.6), Math.round(cell*0.34));
    ctx.fillStyle = PAL.lamp[0];
    ctx.fillRect(x-Math.round(cell*0.2), top-Math.round(cell*0.2), Math.round(cell*0.4), Math.round(cell*0.2));
  }
}

function drawGround(){
  const gp = cell*0.94/8;
  for(const row of ROWS){
    const y = ledgeY(row);
    const isFloor = row === floorRow();
    if(isFloor){
      if(PAL.lamp) drawLamps(y);
      for(let x = -cell; x < W + cell; x += cell)
        sprite(GROUND_MAP, x + cell*0.5, y + cell*0.5, gp, COL_GROUND, 1);
      if(PAL.lamp){
        const step = Math.max(cell*9, W/4), pw = Math.round(cell*1.7);
        ctx.fillStyle = PAL.lamp[1];
        for(let i=0; i*step < W+step; i++)
          ctx.fillRect(Math.round(i*step+step*0.55)-(pw>>1), Math.round(y+cell*0.12),
                       pw, Math.max(2, Math.round(cell*0.2)));
      }
    }else{
      ctx.fillStyle = PAL.post;
      ctx.fillRect(0, y + cell*0.28, W, cell*0.44);
      ctx.fillStyle = PAL.plank;
      ctx.fillRect(0, y + cell*0.28, W, cell*0.14);
      ctx.fillStyle = OUT;
      ctx.fillRect(0, y + cell*0.24, W, Math.max(2, cell*0.07));
      ctx.fillRect(0, y + cell*0.72, W, Math.max(2, cell*0.07));
    }
    if(isFloor){
      ctx.fillStyle = PAL.soil;
      ctx.fillRect(0, y + cell, W, H - (y + cell));
      ctx.fillStyle = PAL.soil2;
      for(let x = 0; x < W; x += cell*2)
        ctx.fillRect(x, y + cell, cell, H - (y + cell));
    }
  }
}

// 電鑽頂點的衝擊效果：震動放射線＋粉塵雲，每一幀都畫（不是機率觸發），
// 這樣不管截到哪一幀凍結畫面，都看得出「正在打」
function drawImpact(x, y){
  const n = 6, len = cell*(0.55 + 0.18*Math.abs(Math.sin(time*30)));
  ctx.strokeStyle = OUT; ctx.lineWidth = Math.max(2, Math.round(cell*0.09));
  ctx.beginPath();
  for(let i=0;i<n;i++){
    const a = (i/n)*Math.PI*2 + time*2.4;
    const x0 = Math.round(x+Math.cos(a)*cell*0.32), y0 = Math.round(y+Math.sin(a)*cell*0.32);
    const x1 = Math.round(x+Math.cos(a)*(cell*0.32+len)), y1 = Math.round(y+Math.sin(a)*(cell*0.32+len));
    ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
  }
  ctx.stroke();

  ctx.fillStyle = PAL.haze;
  const dn = 5, ds = Math.max(2, Math.round(cell*0.3));
  for(let i=0;i<dn;i++){
    const a = (i/dn)*Math.PI*2 + time*1.6;
    const dx = Math.round(x+Math.cos(a)*cell*0.6), dy = Math.round(y+Math.sin(a)*cell*0.4 - cell*0.2);
    ctx.fillRect(dx-ds/2, dy-ds/2, ds, ds);
  }
}

// 工人腳下的鷹架：一塊踏板加兩根立柱，一路撐到地面。
// 畫在磚塊之前，立柱才會在數字後面，不會把還沒拆到的磚遮掉
function drawRig(x, footY, groundY){
  const top = Math.round(footY), gnd = Math.round(groundY);
  if(top > gnd - cell*0.5) return;
  const hw = Math.max(4, Math.round(cell*1.15)), lw = Math.max(2, Math.round(cell*0.11));
  const pt = Math.max(3, Math.round(cell*0.18)), cxr = Math.round(x);
  ctx.fillStyle = PAL.post;
  ctx.fillRect(cxr-hw, top+pt, lw, gnd-top-pt);
  ctx.fillRect(cxr+hw-lw, top+pt, lw, gnd-top-pt);
  ctx.fillStyle = PAL.plank;
  ctx.fillRect(cxr-hw-lw, top, hw*2+lw*2, pt);
  ctx.fillStyle = OUT;
  ctx.fillRect(cxr-hw-lw, top+pt, hw*2+lw*2, Math.max(2, Math.round(cell*0.06)));
}

// 工人（連同手上的工具）這一幀的水平位置。直式版面左右幾乎沒有餘裕，
// 人寧可貼著數字也不能被畫布切掉，所以夾進畫面；工具跟著手一起移，
// 人與工具永遠是同一個剛體。鷹架也用同一個值算，柱子才不會跟腳分家。
function workerAt(R){
  const isDemo = R.phase==='enterDemo' || R.phase==='drill' || R.phase==='swap';
  const map = isDemo ? DEMO_BODY : BUILD_BODY;
  const cols = map[0].length, px = RIG_H()/map.length;
  const off = ((isDemo?DEMO_HAND:BUILD_HAND) + 0.5 - cols/2)*px, half = cols*px/2;
  return { isDemo, map, px, off,
           cx: Math.min(W-2-half, Math.max(2+half, R.wx - off)) };
}

// 工地邊上那位一直都在的工頭：沒在施工的時候，畫面上也還是看得到人
function drawForeman(){
  const gnd = ledgeY(floorRow());
  const h = RIG_H(), px = h/IDLE_BODY.length;
  const x = Math.max(cell*2.6, originX*0.55);
  const bob = (!RM && Math.floor(time*1.6)%2) ? Math.max(1, cell*0.06) : 0;
  sprite(IDLE_BODY, x, gnd - h/2 - bob, px, COL_IDLE, 1);
  sprite(CART_MAP, x + cell*1.9, gnd - cell*0.42, cell*0.17, COL_CART, 1);
}

function draw(){
  ctx.save();
  if(shake > 0.01 && !RM){
    const a = shake * cell * 0.2;
    ctx.translate((Math.random()-0.5)*a, (Math.random()-0.5)*a);
  }

  drawBackground();
  drawGround();

  for(const R of runs){
    if(R.phase==='drill' || R.phase==='swap' || R.phase==='build' || R.phase==='settle')
      drawRig(workerAt(R).cx, R.wy + REACH() + RIG_H(), ledgeY(floorRow()));
  }
  drawForeman();

  const bp = cell*0.94/8;
  for(const b of bricks){
    const pop = b.pop || 0;
    sprite(BRICK_MAP, b.x, b.y - pop*cell*0.1, bp, COL_BRICK, 1, 0, 1+pop*0.18, 1-pop*0.18);
  }

  for(const s of shards){
    ctx.save();
    ctx.globalAlpha = Math.min(1, s.life*2);
    ctx.translate(Math.round(s.x), Math.round(s.y)); ctx.rotate(s.rot);
    ctx.fillStyle = PAL.shard; ctx.fillRect(-s.s/2, -s.s/2, s.s, s.s);
    ctx.strokeStyle = OUT; ctx.lineWidth = Math.max(1, s.s*0.16);
    ctx.strokeRect(-s.s/2, -s.s/2, s.s, s.s);
    ctx.restore();
  }

  const kp = cell*0.6/8;
  for(const c of bolts)
    sprite(BOLT_MAP, c.x, c.y, kp, COL_BOLT, Math.min(1, c.life*2));

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `${Math.round(cell*0.6)}px Silkscreen, monospace`;
  for(const q of pops){
    ctx.globalAlpha = Math.min(1, q.life*1.6);
    ctx.lineWidth = Math.max(3, cell*0.14); ctx.strokeStyle = OUT;
    ctx.strokeText('+'+q.n, q.x, q.y);
    ctx.fillStyle = PAL.accent; ctx.fillText('+'+q.n, q.x, q.y);
  }
  ctx.globalAlpha = 1;

  for(const q of dust){
    ctx.globalAlpha = Math.min(0.8, q.life*3);
    ctx.fillStyle = PAL.dust;
    ctx.fillRect(q.x-q.s/2, q.y-q.s/2, q.s, q.s);
  }
  for(const q of sparks){
    ctx.globalAlpha = Math.min(1, q.life*6);
    ctx.fillStyle = PAL.spark;
    const s = cell*0.24;
    ctx.fillRect(q.x-s/2, q.y-s/2, s, s);
  }
  ctx.globalAlpha = 1;

  // 工人掛在「他正在處理的那塊磚」底下：R.wx/R.wy 就是工具尖端要頂住的點，
  // 手接在尖端下方 REACH，身體再從手往下長，腳底自然落在鷹架踏板上。
  // 拆除組 13x12 矮胖蹲姿、砌造組 11x14 瘦高站姿，光看剪影就分得出來。
  for(const R of runs){
    if(R.phase==='wait') continue;
    const {isDemo, map, px, off, cx:cx0} = workerAt(R);
    const rows = map.length;
    const moving = R.phase==='enterDemo' || R.phase==='enterBuild' || R.phase==='leave';
    const jitter = (!RM && R.phase==='drill') ? Math.sin(time*40 + R.delay*9)*cell*0.06 : 0;
    const bob = (!RM && moving) ? Math.abs(Math.sin(R.t*16))*cell*0.07 : 0;
    const cx = (moving ? runX(R) - off : cx0) + jitter;
    const tipX = cx + off;
    const tipY = R.wy;
    const footY = tipY + REACH() + RIG_H() - bob;
    const handY = footY - (rows-0.5)*px;

    if(isDemo)   // 先畫電鑽，等一下的手才會蓋在鑽桿上，看起來是握住中段
      sprite(TOOL_DRILL, tipX, tipY + DRILL_L()/2, DRILL_L()/TOOL_DRILL.length, COL_TOOL, 1);
    else if(R.phase!=='leave')   // 手上那塊還沒砌上去的磚
      sprite(BRICK_MAP, tipX, (tipY+handY)/2, cell*0.8/8, COL_BRICK, 1);

    sprite(map, cx, footY - rows*px/2, px, isDemo ? COL_DEMO : COL_BUILD, 1);

    if(R.phase==='drill') drawImpact(tipX, tipY);
    if(!isDemo){
      const side = tipX > W/2 ? -1 : 1;
      sprite(CART_MAP, cx + side*cell*1.5, footY - cell*0.42, cell*0.17, COL_CART, 1);
    }
  }

  ctx.restore();
}

// ── 音效 ────────────────────────────────────────────────────────
let actx=null;
function tone(freq, dur, type, vol, slideTo){
  if(!sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
    o.type=type;
    o.frequency.setValueAtTime(freq,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+0.01);
  }catch(_){}
}
function blip(kind){
  if(kind==='drill')   tone(90, 0.05, 'square', 0.025, 70);
  if(kind==='crumble') tone(140, 0.08, 'square', 0.035, 55);
  if(kind==='place')   tone(520, 0.05, 'triangle', 0.03, 700);
  if(kind==='salvage'){ tone(660, 0.06, 'square', 0.035); setTimeout(()=>tone(990, 0.12, 'square', 0.03), 60); }
}

// ── HUD ─────────────────────────────────────────────────────────
const elCoins=document.getElementById('coins');
const elDate=document.getElementById('date');
const elFill=document.getElementById('fill');
function hud(){
  const d=new Date();
  elCoins.textContent = '×' + String(boltCount).padStart(2,'0');
  elDate.textContent = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  elFill.style.width = ((d.getSeconds()+d.getMilliseconds()/1000)/60*100).toFixed(1)+'%';
}

// ── 控制 ────────────────────────────────────────────────────────
const bFmt=document.getElementById('bFmt'), bSnd=document.getElementById('bSnd'),
      bWake=document.getElementById('bWake'), bFull=document.getElementById('bFull'),
      bInstall=document.getElementById('bInstall');

document.getElementById('bTest').onclick = () => startChange(timeStr(), true);
bFmt.onclick = () => { h24=!h24; bFmt.textContent=h24?'24H':'12H';
  bFmt.setAttribute('aria-pressed', String(h24)); startChange(timeStr(), true); };
bSnd.onclick = () => { sound=!sound; bSnd.setAttribute('aria-pressed', String(sound)); if(sound) blip('place'); };
bFull.onclick = () => {
  const s=document.getElementById('stage');
  if(document.fullscreenElement) document.exitFullscreen(); else s.requestFullscreen?.();
};

let wl=null, keepAwake=false;
async function setWake(on){
  keepAwake=on; bWake.setAttribute('aria-pressed', String(on));
  try{
    if(on && 'wakeLock' in navigator) wl = await navigator.wakeLock.request('screen');
    else if(wl){ await wl.release(); wl=null; }
  }catch(_){}
}
bWake.onclick = () => setWake(!keepAwake);
document.addEventListener('visibilitychange', () => {
  if(keepAwake && document.visibilityState==='visible') setWake(true);
});

addEventListener('keydown', e=>{
  if(e.target.tagName==='BUTTON') return;
  const k=e.key.toLowerCase();
  if(k===' '){ e.preventDefault(); startChange(timeStr(), true); }
  if(k==='t') bFmt.click();
  if(k==='s') bSnd.click();
  if(k==='w') bWake.click();
  if(k==='f') bFull.click();
});
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout,120));

let restTimer=null;
function wake(){
  document.body.classList.remove('rest');
  clearTimeout(restTimer);
  restTimer=setTimeout(()=>document.body.classList.add('rest'), 4000);
}
['pointermove','pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,wake,{passive:true}));
wake();

// ── PWA ─────────────────────────────────────────────────────────
const EMBED = new URLSearchParams(location.search).has('embed');
if(EMBED) document.body.classList.add('embed');

let deferred=null;
addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferred=e; bInstall.hidden=false; });
bInstall.onclick = async () => {
  if(!deferred) return;
  deferred.prompt(); await deferred.userChoice; deferred=null; bInstall.hidden=true;
};
addEventListener('appinstalled', ()=>{ bInstall.hidden=true; });

if(!EMBED && 'serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

// ── 啟動 ────────────────────────────────────────────────────────
layout();
want = timeStr().split('');
for(let d=0; d<4; d++){ if(buildDigit(d, want[d])) placeAllCells(d, want[d]); }
hud(); setInterval(hud, 100);

let last=performance.now();
(function frame(now){
  const dt=Math.min((now-last)/1000, 0.05); last=now; time+=dt;
  update(dt); draw();
  requestAnimationFrame(frame);
})(last);
})();
</script>
</body>
