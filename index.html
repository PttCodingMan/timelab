<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="title">CLOCK LAB — 時鐘實驗室</title>
<meta name="description" content="研究時鐘還能長成什麼樣子的實驗室。每一座都是獨立的一頁，滑過去就會開始跑。 A lab for finding out what else a clock can look like. Each one is its own page — hover and it starts running.">
<meta name="theme-color" content="#dee1e3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#dee1e3;
    --face:#f4f5f6;
    --ink:#14171b;
    --ink-2:#6a7076;
    --rule:#b9bfc4;
    --accent:#14171b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--paper);color:var(--ink);
    font-family:'IBM Plex Mono',ui-monospace,'Courier New',monospace;
    font-size:14px;line-height:1.6;
    padding:clamp(20px,4vw,56px);
  }

  /* ── 抬頭：這一頁本身也是一個時鐘 ───────────────────────────── */
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;
         gap:24px 32px;padding-bottom:22px;border-bottom:1px solid var(--ink)}
  .mark{font-family:'Archivo',sans-serif;font-weight:900;
        font-size:clamp(44px,9vw,104px);line-height:.86;letter-spacing:-.045em}
  .sub{color:var(--ink-2);font-size:12px;margin-top:14px;max-width:34ch}
  .readout{text-align:right;flex:0 0 auto}
  #now{font-variant-numeric:tabular-nums;font-weight:600;
       font-size:clamp(26px,4.4vw,42px);line-height:1;letter-spacing:-.02em}
  #now .s{color:var(--ink-2)}
  .meta{font-size:11px;color:var(--ink-2);margin-top:9px;letter-spacing:.08em}
  #bLang{font:inherit;font-size:11px;letter-spacing:.08em;color:var(--ink);
         background:none;border:1px solid var(--rule);padding:3px 9px;
         margin-top:9px;cursor:pointer}
  #bLang:hover{border-color:var(--ink)}

  /* ── 收藏格 ─────────────────────────────────────────────────── */
  .grid{display:grid;gap:clamp(28px,4vw,52px) clamp(20px,3vw,36px);
        grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
        padding:clamp(28px,5vw,56px) 0 60px;list-style:none}

  .card{display:block;color:inherit;text-decoration:none}
  .eyebrow{display:flex;align-items:center;gap:9px;font-size:11px;
           letter-spacing:.14em;color:var(--ink-2);margin-bottom:10px}
  .dot{width:9px;height:9px;background:var(--accent);flex:0 0 auto}

  .frame{position:relative;aspect-ratio:16/10;border:1px solid var(--ink);
         background:#05060a;overflow:hidden;
         transition:transform .28s cubic-bezier(.2,.7,.3,1),box-shadow .28s}
  .card:hover .frame,.card:focus-visible .frame{
         transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--ink)}
  .card:focus-visible{outline:none}
  .card:focus-visible .frame{outline:2px solid var(--accent);outline-offset:3px}
  .frame img,.frame iframe{position:absolute;inset:0;width:100%;height:100%;
         border:0;display:block;object-fit:cover}
  .frame iframe{opacity:0;transition:opacity .35s ease}
  .frame iframe.on{opacity:1}
  .ph{position:absolute;inset:0;display:grid;place-items:center;
      color:var(--ink-2);font-size:11px;letter-spacing:.14em}

  .live{position:absolute;left:9px;bottom:9px;display:flex;align-items:center;gap:6px;
        background:rgba(5,6,10,.72);color:#fff;font-size:10px;letter-spacing:.16em;
        padding:4px 8px;opacity:0;transition:opacity .3s}
  .live.on{opacity:1}
  .live i{width:6px;height:6px;border-radius:50%;background:var(--accent);
          animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.25}}

  h2{font-size:15px;font-weight:600;margin:14px 0 4px;letter-spacing:-.01em}
  .card:hover h2{text-decoration:underline;text-underline-offset:3px}
  .tag{font-size:12px;color:var(--ink-2)}
  .foot{display:flex;justify-content:space-between;gap:12px;margin-top:11px;
        padding-top:9px;border-top:1px solid var(--rule);
        font-size:11px;color:var(--ink-2);letter-spacing:.06em}

  footer{border-top:1px solid var(--ink);padding-top:18px;
         font-size:11px;color:var(--ink-2);letter-spacing:.06em;
         display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
  a.plain{color:var(--ink)}
  .empty{padding:70px 0;color:var(--ink-2);font-size:13px}

  @media (prefers-reduced-motion:reduce){
    .frame,.card:hover .frame{transition:none;transform:none;box-shadow:none}
    .live i{animation:none}
  }
</style>
</head>
<body>
<header>
  <div>
    <div class="mark">CLOCK LAB</div>
    <p class="sub" data-i18n="sub">研究時鐘還能長成什麼樣子的實驗室。每一座都是獨立的一頁，滑過去就會開始跑。</p>
  </div>
  <div class="readout">
    <div id="now">--:--<span class="s">:--</span></div>
    <div class="meta" id="count" data-i18n="count">載入中</div>
    <button id="bLang">EN</button>
  </div>
</header>

<ul class="grid" id="grid"></ul>

<footer>
  <span id="tz">—</span>
  <span><span data-i18n="source">原始碼在</span> <a class="plain" href="https://github.com/PttCodingMan/clocklab">GitHub</a></span>
</footer>

<script>
(() => {
'use strict';
// ── 語言 ────────────────────────────────────────────────────────
const EN = {
  title: 'CLOCK LAB — Clock Laboratory',
  sub:   'A lab for finding out what else a clock can look like. Each one is its own page — hover and it starts running.',
  count: 'Loading',
  source:'Source on',
};
const LANG_EN = (localStorage.getItem('clocklab.lang')
              || (navigator.language.startsWith('zh') ? 'zh' : 'en')) === 'en';
if(LANG_EN){
  document.documentElement.lang = 'en';
  document.querySelectorAll('[data-i18n]').forEach(e => e.replaceChildren(EN[e.dataset.i18n]));
}
{
  const b = document.getElementById('bLang');
  b.textContent = LANG_EN ? '中' : 'EN';
  b.onclick = () => { localStorage.setItem('clocklab.lang', LANG_EN ? 'zh' : 'en'); location.reload(); };
}
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const grid = document.getElementById('grid');

// 抬頭的即時時間
const elNow = document.getElementById('now');
const p2 = n => String(n).padStart(2,'0');
function tick(){
  const d = new Date();
  elNow.innerHTML = `${p2(d.getHours())}:${p2(d.getMinutes())}<span class="s">:${p2(d.getSeconds())}</span>`;
}
tick(); setInterval(tick, 250);
document.getElementById('tz').textContent =
  Intl.DateTimeFormat().resolvedOptions().timeZone || 'local';

function card(c, i){
  const li = document.createElement('li');
  const a = document.createElement('a');
  a.className = 'card';
  a.href = `./${c.id}/`;
  a.style.setProperty('--accent', c.accent || '#14171b');

  const tags = (c.tags || []).join(' · ');
  a.innerHTML = `
    <div class="eyebrow"><span class="dot"></span><span>${p2(i+1)}</span></div>
    <div class="frame">
      <div class="ph">${LANG_EN ? 'No screenshot yet' : '尚無截圖'}</div>
      <span class="live"><i></i>LIVE</span>
    </div>
    <h2></h2>
    <p class="tag"></p>
    <div class="foot"><span>${tags}</span><span>${c.created || ''}</span></div>`;

  a.querySelector('h2').textContent = LANG_EN ? c.name_en : c.name;
  a.querySelector('.tag').textContent = (LANG_EN ? c.tagline_en : c.tagline) || '';

  const frame = a.querySelector('.frame');
  const live  = a.querySelector('.live');

  if(c.thumb){
    const img = new Image();
    img.src = c.thumb; img.alt = LANG_EN ? `${c.name_en} screen` : `${c.name}的畫面`; img.loading = 'lazy';
    img.onload = () => a.querySelector('.ph')?.remove();
    frame.prepend(img);
  }

  // 招牌動作：滑過去或用鍵盤 focus，靜態截圖就換成真的在跑的時鐘
  let ifr = null, off = null;
  const start = () => {
    if(RM || ifr) return;
    clearTimeout(off);
    ifr = document.createElement('iframe');
    ifr.src = `./${c.id}/?embed=1`;
    ifr.title = LANG_EN ? `${c.name_en} preview` : `${c.name}預覽`;
    ifr.setAttribute('scrolling','no');
    ifr.setAttribute('tabindex','-1');
    ifr.setAttribute('aria-hidden','true');
    ifr.onload = () => { ifr.classList.add('on'); live.classList.add('on'); };
    frame.appendChild(ifr);
  };
  const stop = () => {
    if(!ifr) return;
    ifr.classList.remove('on'); live.classList.remove('on');
    const dead = ifr; ifr = null;
    off = setTimeout(() => dead.remove(), 380);
  };
  a.addEventListener('pointerenter', start);
  a.addEventListener('pointerleave', stop);
  a.addEventListener('focus', start);
  a.addEventListener('blur', stop);

  li.appendChild(a);
  return li;
}

fetch('./clocks.json', {cache:'no-cache'})
  .then(r => r.json())
  .then(list => {
    document.getElementById('count').textContent = LANG_EN
      ? `${p2(list.length)} clocks · by date built`
      : `${p2(list.length)} 座 · 依建立時間`;
    if(!list.length){
      grid.innerHTML = LANG_EN
        ? '<li class="empty">No clocks yet. Make a folder, drop in index.html and clock.json, rebuild and it shows up here.</li>'
        : '<li class="empty">還沒有時鐘。建一個資料夾、放 index.html 和 clock.json，重新 build 就會出現在這裡。</li>';
      return;
    }
    list.forEach((c,i) => grid.appendChild(card(c,i)));
  })
  .catch(() => {
    document.getElementById('count').textContent = LANG_EN ? "Can't load list" : '讀不到清單';
    grid.innerHTML = LANG_EN
      ? '<li class="empty">clocks.json not found. Run <code>python tools/build.py</code> first.</li>'
      : '<li class="empty">找不到 clocks.json。先跑 <code>python tools/build.py</code>。</li>';
  });
})();
</script>
</body>
</html>
